<svg width="860" height="220" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WardenOne — One extension. Every defence.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160b24"/>
      <stop offset="0.55" stop-color="#231038"/>
      <stop offset="1" stop-color="#2e1246"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b06ad4"/>
      <stop offset="1" stop-color="#e07ab0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="859" height="219" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="859" height="219" rx="24" fill="url(#sheen)"/>
  <rect x="1" y="1" width="858" height="218" rx="23" fill="none" stroke="#b06ad4" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- shield emblem -->
  <g transform="translate(70,52)">
    <path d="M56 2 L106 20 V60 C106 96 84 118 56 130 C28 118 6 96 6 60 V20 Z"
          fill="url(#accent)" fill-opacity="0.14"/>
    <path d="M56 2 L106 20 V60 C106 96 84 118 56 130 C28 118 6 96 6 60 V20 Z"
          fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="56" y="86" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
          font-size="66" font-weight="800" fill="url(#accent)" text-anchor="middle">1</text>
  </g>

  <!-- wordmark -->
  <text x="222" y="108" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
        font-size="64" font-weight="800" letter-spacing="-1" fill="#ffffff">Warden<tspan fill="url(#accent)">One</tspan></text>

  <!-- tagline -->
  <rect x="224" y="132" width="46" height="4" rx="2" fill="url(#accent)"/>
  <text x="284" y="150" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="600" fill="#d9c7ec">One extension. Every defence.</text>

  <text x="224" y="186" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif"
        font-size="16.5" font-weight="500" fill="#9c86b8" letter-spacing="0.3">All-in-one privacy, security &amp; anti-scam protection · Manifest V3 · No telemetry</text>
</svg>
