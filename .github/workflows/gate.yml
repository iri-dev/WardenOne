# Runs the same gate that has to pass before a commit: syntax checks, the
# byte-exact src/content.js -> content.min.js rebuild, the security posture
# check, and every tools/test-*.js suite.
#
# It runs on Linux even though the extension is developed on Windows. That is
# safe because .gitattributes normalises every text file to LF in the working
# tree on all platforms, so the byte-exact rebuild check compares the same bytes
# here as it does locally. There are no dependencies to install.
name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: check-maintainability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run the maintainability gate
        run: node tools/check-maintainability.js

  # ---------------------------------------------------------------------------
  # Why main publishes itself.
  #
  # A Release is pinned to the commit it was cut from, so the moment main moves
  # ahead, the zip people download is out of date -- and the only way to fix that
  # used to be cutting a whole new version by hand. That does not survive contact
  # with normal work: v1.0.0 sat 171 commits behind before anyone noticed, and
  # everyone who followed its install instructions in the meantime got July's
  # extension while believing they had the current one.
  #
  # So every push that passes the gate above rebuilds a rolling `latest-build`
  # and replaces the package attached to it. It is explicitly GitHub's "Latest"
  # release so the ordinary download never falls behind main. Versioned releases
  # remain milestone archives; nothing here needs a new version number, which is
  # the point.
  # ---------------------------------------------------------------------------
  rolling-build:
    name: publish-latest-build
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package the extension
        # The same command used to cut a real release, so this zip has the same
        # shape: .gitattributes export-ignore keeps tools/, src/, site/, docs/
        # and .github/ out of what people load unpacked.
        #
        # NO --prefix, deliberately. manifest.json has to sit at the root of the
        # zip. With a prefix the archive contains a WardenOne/ folder, and every
        # GUI unzipper ALSO creates a folder named after the archive -- so
        # Windows "Extract All" produces WardenOne-latest\WardenOne\manifest.json.
        # Pointing "Load unpacked" at the folder you just extracted then fails
        # with "Manifest file is missing or unreadable", which is a miserable
        # first experience and looks like the extension is broken.
        run: git archive --format=zip -o WardenOne-latest.zip HEAD

      - name: Write the notes
        run: |
          # Quoted heredoc, so the backticks below stay literal markdown instead
          # of being run as commands. The two values are filled in afterwards.
          cat > notes.md <<'EOF'
          **This is WardenOne's latest build: the current state of `main`, rebuilt after every passing change.**

          GitHub marks this rolling release as **Latest** so the normal download never falls behind the
          repository. Versioned releases remain available as milestone archives and do not need to move
          for every commit.

          Built from commit `__SHA__` — extension version `__VERSION__`. The full gate passed before it
          was published, but this build has had no hands-on testing beyond that.

          To install: unzip it, open `chrome://extensions`, turn on **Developer mode**, click
          **Load unpacked** and pick the folder you just unzipped — the one with `manifest.json`
          directly inside it.
          EOF
          sed -i "s/__SHA__/$(git rev-parse --short HEAD)/" notes.md
          sed -i "s/__VERSION__/$(node -p "require('./manifest.json').version")/" notes.md

      - name: Move the rolling tag to this commit
        run: |
          git tag -f latest-build "$GITHUB_SHA"
          git push -f origin latest-build

      - name: Publish or refresh the rolling build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Updated in place rather than deleted and recreated, so watchers are
          # not notified of a brand new release on every single push.
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build WardenOne-latest.zip --clobber
            gh release edit latest-build --notes-file notes.md --prerelease=false --latest
          else
            gh release create latest-build WardenOne-latest.zip \
              --title "Latest build (main)" \
              --notes-file notes.md \
              --latest
          fi
