# Runs the same gate that has to pass before a commit (see MAINTAINABILITY.md):
# syntax checks, the byte-exact src/content.js -> content.min.js rebuild, the
# security posture check, and every tools/test-*.js suite.
#
# It runs on Linux even though the extension is developed on Windows. That is
# safe because .gitattributes normalises every text file to LF in the working
# tree on all platforms, so the byte-exact rebuild check compares the same bytes
# here as it does locally. There are no dependencies to install.
name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: check-maintainability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run the maintainability gate
        run: node tools/check-maintainability.js
