# Runs the maintainability gate: syntax checks, the byte-exact
# src/content.js -> content.min.js rebuild, the security posture check, and every
# tools/test-*.js suite. No dependencies to install.
#
# Runs on Linux although development is on Windows. .gitattributes normalises text
# files to LF in the working tree on every platform, so the byte-exact rebuild
# check compares the same bytes here as it does locally.
name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: check-maintainability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run the maintainability gate
        run: node tools/check-maintainability.js

  # Every push that passes the gate rebuilds the rolling `latest-build` release and
  # replaces the package attached to it, so the ordinary download always matches
  # main. Versioned releases stay as milestone archives and do not move.
  rolling-build:
    name: publish-latest-build
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package the extension
        # Same command used to cut a real release: .gitattributes export-ignore keeps
        # tools/, src/, site/, docs/ and .github/ out of the package.
        #
        # No --prefix. manifest.json must sit at the root of the zip, because GUI
        # unzippers also create a folder named after the archive -- with a prefix,
        # "Extract All" gives WardenOne-latest\WardenOne\manifest.json and
        # "Load unpacked" then fails with "Manifest file is missing or unreadable".
        run: git archive --format=zip -o WardenOne-latest.zip HEAD

      - name: Write the notes
        run: |
          # Quoted heredoc so the backticks stay literal markdown. The two
          # placeholders are filled in below.
          cat > notes.md <<'EOF'
          **This is WardenOne's latest build: the current state of `main`, rebuilt after every passing change.**

          GitHub marks this rolling release as **Latest** so the normal download never falls behind the
          repository. Versioned releases remain available as milestone archives and do not need to move
          for every commit.

          Built from commit `__SHA__` — extension version `__VERSION__`. The full gate passed before it
          was published, but this build has had no hands-on testing beyond that.

          To install: unzip it, open `chrome://extensions`, turn on **Developer mode**, click
          **Load unpacked** and pick the folder you just unzipped — the one with `manifest.json`
          directly inside it.
          EOF
          sed -i "s/__SHA__/$(git rev-parse --short HEAD)/" notes.md
          sed -i "s/__VERSION__/$(node -p "require('./manifest.json').version")/" notes.md

      - name: Move the rolling tag to this commit
        run: |
          git tag -f latest-build "$GITHUB_SHA"
          git push -f origin latest-build

      - name: Publish or refresh the rolling build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Updated in place rather than recreated, so watchers are not notified of a
          # new release on every push.
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build WardenOne-latest.zip --clobber
            gh release edit latest-build --notes-file notes.md --prerelease=false --latest
          else
            gh release create latest-build WardenOne-latest.zip \
              --title "Latest build (main)" \
              --notes-file notes.md \
              --latest
          fi
