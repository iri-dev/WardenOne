# Runs the maintainability gate: syntax checks, the byte-exact
# src/content.js -> content.min.js rebuild, the security posture check, and every
# tools/test-*.js suite. No dependencies to install.
#
# Runs on Linux although development is on Windows. .gitattributes normalises text
# files to LF in the working tree on every platform, so the byte-exact rebuild
# check compares the same bytes here as it does locally.
name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each test job cancels its own stale run. Publication is serialised and never cancelled once
# started; a complete commit-tagged release becomes Latest only after both assets are verified.
jobs:
  gate:
    name: check-maintainability
    runs-on: ubuntu-latest
    concurrency:
      group: gate-${{ github.ref }}-maintainability
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Run the maintainability gate
        run: node tools/check-maintainability.js

      - name: Record package footprint
        run: node tools/check-performance-budget.js --out performance-metrics.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-footprint-${{ github.sha }}
          path: performance-metrics.json
          retention-days: 90

  browser-popup:
    name: real-popup-regression
    runs-on: windows-2025
    timeout-minutes: 10
    concurrency:
      group: gate-${{ github.ref }}-popup
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Test the popup in Edge
        env:
          WARDENONE_HEADLESS: '1'
        run: node tools/browser-popup-regression.js

  # The Settings page in Edge: switches, search, backup and import, clean-up, permissions, keys,
  # list status and a full reset, then section order, saved sites, Help and About, then Settings,
  # the popup and the worker writing the config at the same moment, then the page engine on a real
  # page. Each step runs even when one before it fails, so one run reports them all.
  browser-settings:
    name: real-settings-regression
    runs-on: windows-2025
    timeout-minutes: 15
    concurrency:
      group: gate-${{ github.ref }}-settings
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Test Settings data, search and reset in Edge
        env:
          WARDENONE_HEADLESS: '1'
        run: node tools/browser-settings-data.js

      - name: Test Settings arrangement, sites, Help and About in Edge
        if: success() || failure()
        env:
          WARDENONE_HEADLESS: '1'
        run: node tools/browser-settings-arrange.js

      - name: Test simultaneous config writes from Settings, the popup and the worker in Edge
        if: success() || failure()
        env:
          WARDENONE_HEADLESS: '1'
        run: node tools/browser-config-race.js

      - name: Test the page engine, the bridge and a network rule on a real page in Edge
        if: success() || failure()
        env:
          WARDENONE_HEADLESS: '1'
        run: node tools/browser-engine-smoke.js

  # The manifest's minimum_chrome_version, proven in that Chrome rather than assumed: Chrome for
  # Testing at the minimum, pinned by version and SHA-256, runs the popup and Settings suites and
  # the page engine on a real page.
  # tools/test-download-links.js keeps the version here at the manifest's minimum. The tests only
  # run once that Chrome is in place, so a failed download cannot fall back to Edge and pass.
  browser-minimum:
    name: minimum-chrome-regression
    runs-on: windows-2025
    timeout-minutes: 20
    concurrency:
      group: gate-${{ github.ref }}-minimum
      cancel-in-progress: true
    env:
      CHROME_MINIMUM_VERSION: '121.0.6167.184'
      CHROME_MINIMUM_SHA256: 'b400e16bec567f676e83ff33719b5657dd26113fb54a6e2ec875709363428e9b'
      WARDENONE_HEADLESS: '1'
      WARDENONE_BROWSER_NAME: 'Google Chrome'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install Chrome for Testing at the minimum version
        id: chrome
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'chrome-minimum.zip'
          Invoke-WebRequest -Uri "https://storage.googleapis.com/chrome-for-testing-public/$env:CHROME_MINIMUM_VERSION/win64/chrome-win64.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:CHROME_MINIMUM_SHA256) { throw "chrome-win64.zip has SHA-256 $hash, expected $env:CHROME_MINIMUM_SHA256" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $exe = Join-Path $env:RUNNER_TEMP 'chrome-win64\chrome.exe'
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          if ($version -ne $env:CHROME_MINIMUM_VERSION) { throw "chrome.exe is $version, expected $env:CHROME_MINIMUM_VERSION" }
          "WARDENONE_BROWSER_PATH=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Chrome $version at $exe"

      - name: Test the popup in Chrome at the minimum version
        run: node tools/browser-popup-regression.js

      - name: Test Settings data, search and reset in Chrome at the minimum version
        if: (success() || failure()) && steps.chrome.outcome == 'success'
        run: node tools/browser-settings-data.js

      - name: Test Settings arrangement, sites, Help and About in Chrome at the minimum version
        if: (success() || failure()) && steps.chrome.outcome == 'success'
        run: node tools/browser-settings-arrange.js

      - name: Test simultaneous config writes in Chrome at the minimum version
        if: (success() || failure()) && steps.chrome.outcome == 'success'
        run: node tools/browser-config-race.js

      - name: Test the page engine, the bridge and a network rule in Chrome at the minimum version
        if: (success() || failure()) && steps.chrome.outcome == 'success'
        run: node tools/browser-engine-smoke.js

  # Each passing push gets a commit-tagged release. The stable /releases/latest/download URL
  # follows only a complete release, while a draft and its assets remain invisible to readers.
  rolling-build:
    name: publish-latest-build
    needs: [gate, browser-popup, browser-settings, browser-minimum]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A draft can be retried safely; an already published commit release is never overwritten.
    concurrency:
      group: publish-latest-build
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Package the extension
        # Same command used to cut a real release: .gitattributes export-ignore keeps
        # tools/, src/, site/, docs/ and .github/ out of the package.
        #
        # No --prefix. manifest.json must sit at the root of the zip, because GUI
        # unzippers also create a folder named after the archive -- with a prefix,
        # "Extract All" gives WardenOne-latest\WardenOne\manifest.json and
        # "Load unpacked" then fails with "Manifest file is missing or unreadable".
        run: git archive --format=zip -o WardenOne-latest.zip HEAD

      - name: Verify release archive inventory
        run: node tools/check-package-archive.js WardenOne-latest.zip

      - name: Write and verify the ZIP checksum
        run: |
          sha256sum WardenOne-latest.zip > WardenOne-latest.zip.sha256
          sha256sum --check WardenOne-latest.zip.sha256

      - name: Attest the ZIP build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: WardenOne-latest.zip

      - name: Write the notes
        env:
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          PREV="$(git rev-parse -q --verify "$PREV_TAG" 2>/dev/null || true)"
          if [ -n "$PREV" ] && [ "$PREV" != "$GITHUB_SHA" ]; then
            git log --no-merges --format='- %s' "$PREV..HEAD" > changes.txt
          else
            # First build, or nothing moved: fall back to recent history rather
            # than printing an empty section.
            git log --no-merges --max-count=10 --format='- %s' > changes.txt
          fi
          # Cap it so a long gap does not produce a wall of text.
          if [ "$(wc -l < changes.txt)" -gt 25 ]; then
            EXTRA=$(( $(wc -l < changes.txt) - 25 ))
            head -n 25 changes.txt > capped.txt
            echo "- ...and $EXTRA more changes" >> capped.txt
            mv capped.txt changes.txt
          fi
          [ -s changes.txt ] || echo '- Repackaged with no code changes' > changes.txt

          {
            echo "## What's new"
            echo
            cat changes.txt
            echo
            echo "## Install"
            echo
            echo '1. Download **WardenOne-latest.zip** below and unzip it.'
            echo '2. Open `chrome://extensions` and turn on **Developer mode**.'
            echo '3. Click **Load unpacked** and pick the folder you unzipped — the one with'
            echo '   `manifest.json` directly inside it.'
            echo
            echo '---'
            echo
            echo "This is WardenOne's build from \`main\`, packaged after the gate passed."
            echo
            echo "Version \`$(node -p "require('./manifest.json').version")\` · commit \`$(git rev-parse --short HEAD)\`"
            echo
            echo '<details>'
            echo '<summary>Optional advanced verification — checksum and build origin</summary>'
            echo
            echo 'Only the ZIP is needed to install WardenOne. The .sha256 file and attestation are optional checks for people who want to verify their download.'
            echo
            echo 'The SHA-256 checksum checks that your ZIP matches the published ZIP. The GitHub attestation links those ZIP bytes to this repository workflow and source commit; neither check guarantees the extension is bug-free.'
            echo
            echo "Source commit: \`$GITHUB_SHA\`"
            echo "ZIP SHA-256: \`$(cut -d' ' -f1 WardenOne-latest.zip.sha256)\`"
            echo "[GitHub build attestation]($ATTESTATION_URL) · [How to verify](https://github.com/iri-dev/WardenOne#verify-the-github-download)"
            echo
            echo '</details>'
          } > notes.md

      - name: Prepare the commit release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TAG="build-$GITHUB_SHA"
          if gh release view "$BUILD_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$BUILD_TAG" --json isDraft --jq .isDraft)" = true ]; then
              gh release upload "$BUILD_TAG" WardenOne-latest.zip WardenOne-latest.zip.sha256 --clobber
            fi
          else
            gh release create "$BUILD_TAG" WardenOne-latest.zip WardenOne-latest.zip.sha256 \
              --target "$GITHUB_SHA" --title "WardenOne Build $(git rev-parse --short HEAD)" \
              --notes-file notes.md --draft
          fi

      - name: Verify both assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TAG="build-$GITHUB_SHA"
          mkdir -p downloaded-release
          gh release download "$BUILD_TAG" --pattern 'WardenOne-latest.zip*' --dir downloaded-release
          cmp WardenOne-latest.zip downloaded-release/WardenOne-latest.zip
          cmp WardenOne-latest.zip.sha256 downloaded-release/WardenOne-latest.zip.sha256
          (cd downloaded-release && sha256sum --check WardenOne-latest.zip.sha256)

      - name: Make the complete release Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TAG="build-$GITHUB_SHA"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "main advanced to $MAIN_SHA; keeping $BUILD_TAG without changing Latest"
            exit 0
          fi
          PREV_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          gh release edit "$BUILD_TAG" --draft=false --latest --title "WardenOne Latest"
          test "$(gh release view --json tagName --jq .tagName)" = "$BUILD_TAG"
          if [ "$PREV_TAG" != "$BUILD_TAG" ] && [[ "$PREV_TAG" =~ ^build-[0-9a-f]{40}$ ]]; then
            gh release edit "$PREV_TAG" --title "WardenOne Build ${PREV_TAG:6:7}"
          fi
          # The old fixed-tag asset URL would otherwise keep serving a stale ZIP.
          if gh release view latest-build >/dev/null 2>&1; then
            gh release delete latest-build --cleanup-tag --yes
          fi
