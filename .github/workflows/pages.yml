# Publishes the documents that are meant to be a public web page.
#
# The site is built from a staged directory containing only those pages, so a file
# that is not copied in the step below cannot be published by accident.
#
# Jekyll stays in the loop because PRIVACY.md is the source for the privacy policy
# the Web Store listing points at, and Jekyll renders it to HTML at /PRIVACY.
# Uploading raw markdown would 404 that URL.
name: Pages

# Deployed on request, not on push: CHANGELOG.md is one of the published files and
# changes with almost every fix, which would add a deployment per commit.
#
# Run this when something on the site needs to go live -- in particular after
# editing PRIVACY.md, since the Web Store listing points at the rendered copy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: the privacy policy URL has to stay up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the published pages
        run: |
          # Only what is copied here can be published.
          mkdir -p _pages
          cp site/index.html _pages/
          cp site/404.html _pages/
          cp site/stolen.html _pages/
          # Search Console verification. Google re-checks periodically, so this has
          # to stay served rather than just pass once.
          cp site/google*.html _pages/
          cp site/robots.txt _pages/
          cp site/sitemap.xml _pages/
          cp PRIVACY.md _pages/
          cp SUPPORT.md _pages/
          # Release history and upstream credits, rendered at /CHANGELOG and /CREDITS.
          cp CHANGELOG.md _pages/
          cp CREDITS.md _pages/

          # Images the landing page references, copied individually and renamed so the
          # page does not depend on the repo's directory layout.
          mkdir -p _pages/icons
          cp icons/icon128.png _pages/icons/
          cp docs/store/promo-440x280.png _pages/promo.png
          # The unpadded original, not docs/store/popup.png -- that one is letterboxed
          # to 1280x800 for the Web Store listing.
          cp docs/popup.png _pages/screenshot-popup.png

          cat > _pages/_config.yml <<'CONFIG'
          title: WardenOne
          description: Privacy and security extension for Chromium browsers.
          # index.html carries its own <head>, so Jekyll must not wrap it in a theme.
          # PRIVACY.md and SUPPORT.md still get rendered to HTML.
          CONFIG

          echo "staged:" && ls -1R _pages

      - uses: actions/configure-pages@v5

      # Relative links keep working without a baseurl, so the site is not tied to the
      # repository name.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

      - id: deploy
        uses: actions/deploy-pages@v4
