# Publishes the website in site/ and the documents that are meant to be a public web page.
#
# The site is built from a staged directory containing only the built site and those
# documents, so a file that is not copied in the step below cannot be published by accident.
#
# Jekyll stays in the loop because PRIVACY.md is the source for the privacy policy
# the Web Store listing points at, and Jekyll renders it to HTML at /PRIVACY.
# Uploading raw markdown would 404 that URL.
name: Pages

# Deployed on request, not on push: CHANGELOG.md is one of the published files and
# changes with almost every fix, which would add a deployment per commit.
#
# Run this when something on the site needs to go live -- in particular after
# editing PRIVACY.md, since the Web Store listing points at the rendered copy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: the privacy policy URL has to stay up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # The catalogue, the numbers, the captures, the icon and the documents are copied from
      # this commit, then the site is built and checked. A failed check stops the deploy, so
      # the live site stays as it was.
      - name: Build and check the site
        run: |
          node site/sync-data.js
          node site/build.js
          node site/check.js

      - name: Stage the published pages
        run: |
          # Only what is copied here can be published.
          mkdir -p _pages
          # Every page, its assets, the 404 page, robots.txt, the sitemap, the Search Console
          # verification file and the Jekyll layout the documents are rendered into.
          cp -R site/dist/. _pages/
          # The documents, from this commit, rendered at /PRIVACY, /SUPPORT, /CHANGELOG and
          # /CREDITS. The build already holds the same files; copying them here keeps the
          # published set visible in one place.
          cp PRIVACY.md _pages/
          cp SUPPORT.md _pages/
          cp CHANGELOG.md _pages/
          cp CREDITS.md _pages/
          # The previous site's social preview image. Links shared before the redesign
          # still point their preview here.
          cp docs/store/promo-440x280.png _pages/promo.png

          cat > _pages/_config.yml <<'CONFIG'
          title: WardenOne
          description: Privacy and security extension for Chromium browsers.
          # The site's pages carry their own <head> and no front matter, so Jekyll copies them
          # as they are. The Markdown documents are rendered into _layouts/default.html.
          defaults:
            - scope:
                path: ""
              values:
                layout: default
          CONFIG

          echo "staged:" && ls -1R _pages

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Relative links keep working without a baseurl, so the site is not tied to the
      # repository name.
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./_pages
          destination: ./_site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
